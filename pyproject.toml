[project]
name = "go-judge-client"
version = "0.3.0"
description = "Typed asynchronous streaming client for go-judge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "proto/LICENSE", "proto/PROTOBUF_LICENSE"]
dependencies = ["pydantic>=2.12,<3", "grpcio>=1.84,<2", "protobuf>=7.35.1,<8"]

[project.urls]
Repository = "https://github.com/Inzhenerka/go-judge-client"
Documentation = "https://github.com/Inzhenerka/go-judge-client/blob/main/README.md"
Issues = "https://github.com/Inzhenerka/go-judge-client/issues"

[project.optional-dependencies]
cli = ["typer>=0.25,<1"]

[project.scripts]
go-judge-client = "go_judge_client.cli:main"
gj = "go_judge_client.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "pytest-cov>=7,<8", "ruff>=0.15,<1", "ty>=0.0.20,<1", "poethepoet>=0.40,<1", "typer>=0.25,<1", "grpcio-tools==1.84.0"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/go_judge_client/_grpc", ".research"]

[tool.uv.build-backend]
source-include = ["proto/**", "scripts/**", "docs/**", "examples/**", "tests/**", "uv.lock", ".github/**", "CHANGELOG.md", "SECURITY.md", ".gitattributes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ty.src]
exclude = ["src/go_judge_client/_grpc", ".research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real disposable go-judge server"]

[tool.poe.tasks]
format = "ruff format ."
fix = "ruff check --fix ."
lint = "ruff check ."
typecheck = "ty check"
test = "pytest tests/unit tests/transport tests/typing tests/cli"
prep = ["format", "lint", "typecheck", "test"]
check = [{cmd = "ruff format --check ."}, {cmd = "ruff check ."}, {cmd = "ty check"}, {cmd = "pytest tests/unit tests/transport tests/typing tests/cli"}]
test-integration = "python scripts/integration_watchdog.py"
judge = "docker run --rm --privileged --cgroupns=host --memory 2g --cpus 1 -p 127.0.0.1:15051:5051 go-judge-client-test:1.13.3 -enable-grpc -grpc-addr :5051 -http-addr 127.0.0.1:5050 -no-fallback -parallelism 1"
generate-proto = "python scripts/generate_proto.py"
check-proto = "python scripts/check_proto.py"
build = "uv build --clear"
check-wheel = "python scripts/check_wheel.py"
outdated = "uvx uv-outdated --direct"
upgrade = "uv lock --upgrade"

[tool.coverage.run]
source = ["go_judge_client"]
omit = ["*/_grpc/*", "*/cli/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = true
commit_message = "chore(release): {version} [skip ci]"
assets = ["uv.lock"]
build_command_env = ["UV_CACHE_DIR"]
build_command = """
set -eu
uv lock --upgrade-package "$PACKAGE_NAME"
uv build --clear
uv run --locked python scripts/check_wheel.py
"""

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.changelog]
mode = "init"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*.whl", "dist/*.tar.gz"]
